<!doctype html>
<!-- qom Share — archivos.

     Navegador del share: breadcrumb, árbol de carpetas, búsqueda por
     nombre, detalles (sha256 + historial), upload/download y borrado
     a papelera. Los permisos por carpeta (ACL) los aplica el backend
     — un 403 se muestra tal cual, sin silenciarlo. -->
<html lang="es">
<head>
  <script src="../mock-api.js"></script>

<meta charset="utf-8">
<title>qom Share — Archivos</title>
<link rel="stylesheet" href="/assets/share-ui.css">
<script src="/assets/nav.js" defer nonce="__CSP_NONCE__"></script>
<script src="/assets/share-ui.js" defer nonce="__CSP_NONCE__"></script>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h1>Archivos</h1>
<div class="sui-sub">El borrado va a la papelera sellada — nada se
  destruye aquí.</div>
<div class="sui-msg" id="msg"></div>
<div class="sui-row" style="margin-bottom:.9rem">
  <input class="sui-input" id="q" placeholder="buscar en esta carpeta…" style="width:260px">
  <label class="sui-btn primary" style="display:inline-block">subir archivo
    <input type="file" id="up" hidden></label>
  <button class="sui-btn" id="mkdir">nueva carpeta</button>
  <span class="sui-mut" id="count"></span>
</div>
<div class="sui-crumbs" id="crumbs"></div>
<table class="sui-table">
  <thead><tr><th>nombre</th><th>tamaño</th><th>modificado</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="sui-panel" id="detail" style="display:none"></div>
<script defer nonce="__CSP_NONCE__">
document.addEventListener("DOMContentLoaded", () => {
  ShareUI.layout("files");
  const msg = document.getElementById("msg");
  // Contexto de tenant (el admin navega tenants desde /tenants).
  // El backend valida el scope — este parámetro solo se propaga.
  const tenant = new URLSearchParams(location.search).get("tenant");
  const tq = tenant ? `&tenant=${encodeURIComponent(tenant)}` : "";
  if (tenant) {
    const h1 = document.querySelector("h1");
    if (h1) h1.innerHTML += ` <span class="sui-badge acc">${ShareUI.esc(tenant)}</span>`;
  }
  let cwd = "";
  let entries = [];

  const crumbs = () => {
    const parts = cwd ? cwd.split("/") : [];
    let html = `<a data-p="">raíz</a>`;
    parts.forEach((p, i) => {
      html += ` <span class="sui-mut">/</span> <a data-p="${ShareUI.esc(parts.slice(0, i + 1).join("/"))}">${ShareUI.esc(p)}</a>`;
    });
    document.getElementById("crumbs").innerHTML = html;
    document.querySelectorAll("#crumbs a").forEach((a) =>
      (a.onclick = () => load(a.dataset.p)));
  };

  const rows = () => {
    const term = document.getElementById("q").value.toLowerCase();
    const list = entries.filter((e) => e.name.toLowerCase().includes(term));
    document.getElementById("count").textContent = `${list.length} entradas`;
    document.getElementById("rows").innerHTML = list.length
      ? list.map((e) => {
          const p = cwd ? `${cwd}/${e.name}` : e.name;
          return `<tr>
            <td>${e.is_dir
              ? `<a data-p="${ShareUI.esc(p)}"><span class="sui-badge acc">dir</span> ${ShareUI.esc(e.name)}</a>`
              : `<a data-d="${ShareUI.esc(p)}">${ShareUI.esc(e.name)}</a>`}</td>
            <td>${e.is_dir ? "—" : ShareUI.fmtBytes(e.size)}</td>
            <td class="sui-mut">${ShareUI.fmtTime(e.modified)}</td>
            <td style="white-space:nowrap">
              <a data-i="${ShareUI.esc(p)}">info</a>
              ${e.is_dir ? "" : ` · <a href="/api/v1/share/file?path=${encodeURIComponent(p)}${tq}" download>descargar</a>`}
              · <a data-x="${ShareUI.esc(p)}" style="color:var(--bad)">borrar</a></td>
          </tr>`;
        }).join("")
      : `<tr><td colspan="4" class="sui-mut">vacío</td></tr>`;
    document.querySelectorAll("#rows a[data-p]").forEach((a) =>
      (a.onclick = () => load(a.dataset.p)));
    document.querySelectorAll("#rows a[data-i]").forEach((a) =>
      (a.onclick = () => info(a.dataset.i)));
    document.querySelectorAll("#rows a[data-x]").forEach((a) =>
      (a.onclick = () => del(a.dataset.x)));
  };

  const info = async (p) => {
    const el = document.getElementById("detail");
    el.style.display = "block";
    el.innerHTML = `<span class="sui-mut">consultando…</span>`;
    try {
      const d = await ShareUI.api(`/api/v1/share/file/details?path=${encodeURIComponent(p)}${tq}`);
      el.innerHTML = `<h3>${ShareUI.esc(p)}</h3>
        <div class="sui-mut" style="margin-bottom:.6rem">
          ${d.is_dir ? "carpeta" : "archivo"} · ${ShareUI.fmtBytes(d.size)} ·
          modificado ${ShareUI.fmtTime(d.modified)} · creado ${ShareUI.fmtTime(d.created)}
          ${d.sha256 ? `<br>sha256 <code>${d.sha256}</code>` : ""}</div>
        ${d.history?.length
          ? `<h3>historial</h3>` + d.history.map((h) => `
            <div class="sui-ev"><time>${ShareUI.fmtTime(h.ts)}</time>
              <span class="who">${ShareUI.esc(h.user)}</span>
              <span class="sui-badge acc">${ShareUI.esc(h.op)}</span>
              <span>${ShareUI.esc(h.ip || "")}</span></div>`).join("")
          : `<div class="sui-mut">sin historial registrado</div>`}`;
    } catch (e) {
      el.innerHTML = `<span class="sui-mut">${ShareUI.esc(e.message)}</span>`;
    }
  };

  const del = async (p) => {
    if (!confirm(`¿Enviar "${p}" a la papelera?`)) return;
    try {
      await ShareUI.api(`/api/v1/share/file?path=${encodeURIComponent(p)}${tq}`, { method: "DELETE" });
      ShareUI.msg(msg, `"${p}" está en la papelera`, "ok");
      load(cwd);
    } catch (e) { ShareUI.msg(msg, e.message, "err"); }
  };

  const load = async (p) => {
    cwd = p;
    try {
      const d = await ShareUI.api(`/api/v1/share/files?path=${encodeURIComponent(p)}${tq}`);
      entries = d.entries || [];
      crumbs();
      rows();
      ShareUI.msg(msg, "", "");
    } catch (e) {
      entries = [];
      crumbs();
      rows();
      ShareUI.msg(msg, e.message, "err");
    }
  };

  document.getElementById("q").oninput = rows;
  document.getElementById("up").onchange = async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    const p = cwd ? `${cwd}/${f.name}` : f.name;
    try {
      const res = await fetch(`/api/v1/share/file?path=${encodeURIComponent(p)}${tq}`,
        { method: "PUT", body: f, credentials: "same-origin" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      ShareUI.msg(msg, `"${p}" subido`, "ok");
      load(cwd);
    } catch (e) { ShareUI.msg(msg, e.message, "err"); }
    ev.target.value = "";
  };
  document.getElementById("mkdir").onclick = async () => {
    const name = prompt("Nombre de la carpeta:");
    if (!name) return;
    const p = cwd ? `${cwd}/${name}/.keep` : `${name}/.keep`;
    try {
      await ShareUI.api(`/api/v1/share/file?path=${encodeURIComponent(p)}${tq}`,
        { method: "PUT", body: "" });
      ShareUI.msg(msg, `carpeta "${name}" creada`, "ok");
      load(cwd);
    } catch (e) { ShareUI.msg(msg, e.message, "err"); }
  };
  load("");
});
</script>
</body>
</html>
